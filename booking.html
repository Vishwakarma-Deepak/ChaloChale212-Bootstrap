       <section class="py-5 bg-light text-center">
        <div class="container">
          <h1 class="fw-bold">Travel Booking</h1>
          <p class="lead">Fill the form and submit your travel request</p>
        </div>

       <!-- booking form para end  -->

       <!--booking form started-->
       <section class="py-5">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
              <div class="card shadow-lg p-4 rounded-4">
                <h3 class="fw-bold mb-4 text-center">Book Your Trip</h3>
                

                <form action="">
                  <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                      <label class="form-label">Full Name</label>
                      <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="col-12 col-md-6 mb-3">
                      <label class="form-label">Email</label>
                      <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                  </div>

                  <div class="row">

                    <div class="col-12 col-md-6 mb-3">
                      <label class="form-label">Select Destination</label>
                      <select class="form-select">
                        
                        <option>Goa </option>
                        <option>Manali</option>
                        <option>Kerala</option>
                        <option>Jaipur</option>
                        <option>Agra</option>
                      </select>
                    </div>

                    <div class="col-12 col-md-6 mb-3">
                      <label class="form-label">Travel date</label>
                      <input type="date" class="form-control">
                    </div>

                  </div>

                  <div class="mb-3">
                    <label class="form-label">Number of people</label>
                    <input type="number" class="form-control" placeholder="Enter number of people">
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Message / Requirement</label>
                    <textarea class="form-control" rows="4" placeholder="Enter any message requirement"></textarea>
                  </div>

                  <button  class="btn btn-success w-100" type="submit">
                   Submit Booking Request
                  </button>


                </form>

              
              </div>
            
            </div>
          </div>
        </div>
       </section>
